<!DOCTYPE html>
<html lang="kk">
<head>

    <!-- WhatsApp, Telegram және әлеуметтік желілердегі превью (Open Graph) -->
    <meta property="og:title" content="Нұржігіт & Эльвира — Құдалық тойына шақыру">
    <meta property="og:description" content="Құрметті қонақтар! Сіздерді ұлымыз бен келініміздің Құдалық тойына арналған ақ дастарханымыздың қадірлі қонағы болуға шақырамыз!">
    
    <!-- Превьюде көрінетін суреттің тура сілтемесі -->
    <meta property="og:image" content="https://i.ibb.co.com/h18YSWgL/img.jpg">
    
    <!-- Сайттың толық сілтемесі -->
    <meta property="og:url" content="https://gulziraadilkhan-byte.github.io/kudalyk-invitation/">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Құдалыққа шақыру</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #d4af37;
            --text-color: #333333;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: #666;
        }

        .details {
            margin: 20px 0;
            line-height: 1.8;
            font-size: 1rem;
        }

        /* Төмендегі Музыканы басқару батырмасы */
        .music-control-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .music-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.05);
            background-color: #b89528;
        }

        .music-btn.paused {
            background-color: #888888;
        }

        /* Жауап беру формасы */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        button.submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button.submit-btn:hover {
            background-color: #b89528;
        }

        /* Барлық жауаптар бөлімі */
        .responses-section {
            margin-top: 40px;
            border-top: 1px dashed #ddd;
            padding-top: 20px;
            text-align: left;
        }

        .responses-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-align: center;
        }

        .response-card {
            background: #fafafa;
            border: 1px solid #eee;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .response-name {
            font-weight: 600;
            color: #333;
        }

        .response-status {
            font-size: 0.85rem;
            color: #666;
            margin-top: 3px;
        }

        .response-wish {
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 5px;
            color: #444;
        }
    </style>
</head>
<body>

    <!-- Фонолық музыка -->
    <audio id="bgMusic" loop autoplay preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Музыканы тоқтату/қосу батырмасы -->
    <div class="music-control-wrapper">
        <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
            <i class="fa-solid fa-pause" id="musicIcon"></i>
            <span id="musicText">Музыканы тоқтату</span>
        </button>
    </div>

    <div class="container">
        <h1 class="title">Құдалыққа шақыру</h1>
        <div class="subtitle">Құрметті қонақтар!</div>

        <p class="details">
            Сіздерді қуанышымызға ортақтасып,<br> 
            салтанатты құдалық тойымыздың қадірлі қонағы болуға шақырамыз!
        </p>

        <!-- Форма -->
        <form id="rsvpForm" onsubmit="submitRSVP(event)">
            <div class="form-group">
                <label for="guestName">Аты-жөніңіз:</label>
                <input type="text" id="guestName" required placeholder="Мысалы: Асан мен Айгүл">
            </div>

            <div class="form-group">
                <label for="attendance">Келесіз бе?</label>
                <select id="attendance" required>
                    <option value="Иә, қуана келемін!">Иә, қуана келемін!</option>
                    <option value="Жұбайыммен келемін">Жұбайыммен келемін</option>
                    <option value="Өкінішке орай, келе алмаймын">Өкінішке орай, келе алмаймын</option>
                </select>
            </div>

            <div class="form-group">
                <label for="wishes">Ақ тілек немесе ескерту:</label>
                <textarea id="wishes" rows="3" placeholder="Тілегіңізді жазыңыз..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Жауапты жіберу</button>
        </form>

        <!-- Жауаптар тізімі (Барлығына ортақ сақталады) -->
        <div class="responses-section">
            <div class="responses-title"><i class="fa-solid fa-envelope-open-text"></i> Қонақтардың жауаптары</div>
            <div id="responsesContainer">
                <p style="text-align:center; color:#888;">Жүктелуде...</p>
            </div>
        </div>
    </div>

    <script>
        // --- JSONBin.io Параметрлері ---
        const BIN_ID = '6abb340dac6210605a0075b7'; 
        const MASTER_KEY = '$2a$10$a3oMthSCsTwH6En1jC7NxeZIF.Xfaxu3cByW06gUV/.3r0i1huqTu'; 

        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // --- Музыканы авто-ойнату және тоқтату логикасы ---
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');

        // Сайт ашылғанда ойнатуға тырысу
        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(() => {
                updateMusicUI(true);
            }).catch(() => {
                // Браузер бұғаттаса, пайдаланушы экранды басқанда бірден қосылады
                const startAudio = () => {
                    audio.play();
                    updateMusicUI(true);
                    document.removeEventListener('click', startAudio);
                    document.removeEventListener('touchstart', startAudio);
                };
                document.addEventListener('click', startAudio);
                document.addEventListener('touchstart', startAudio);
            });
        });

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                updateMusicUI(true);
            } else {
                audio.pause();
                updateMusicUI(false);
            }
        }

        function updateMusicUI(isPlaying) {
            if (isPlaying) {
                musicIcon.className = 'fa-solid fa-pause';
                musicText.innerText = 'Музыканы тоқтату';
                musicBtn.classList.remove('paused');
            } else {
                musicIcon.className = 'fa-solid fa-play';
                musicText.innerText = 'Музыканы ойнату';
                musicBtn.classList.add('paused');
            }
        }

        // --- Жауаптарды жүктеу және сақтау ---
        async function fetchResponses() {
            const container = document.getElementById('responsesContainer');
            try {
                const res = await fetch(`${JSONBIN_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                const list = data.record || [];

                if (list.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">Әлі ешкім жауап бермеді.</p>';
                    return list;
                }

                container.innerHTML = list.map(item => `
                    <div class="response-card">
                        <div class="response-name">${escapeHtml(item.name)}</div>
                        <div class="response-status">📌 ${escapeHtml(item.status)}</div>
                        ${item.wish ? `<div class="response-wish">"${escapeHtml(item.wish)}"</div>` : ''}
                    </div>
                `).join('');

                return list;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="text-align:center; color:red;">Жауаптарды жүктеу мүмкін болмады.</p>';
                return [];
            }
        }

        async function submitRSVP(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Жіберілуде...';

            const name = document.getElementById('guestName').value.trim();
            const status = document.getElementById('attendance').value;
            const wish = document.getElementById('wishes').value.trim();

            try {
                const currentList = await fetchResponses();
                currentList.unshift({ name, status, wish, date: new Date().toISOString() });

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(currentList)
                });

                document.getElementById('rsvpForm').reset();
                alert('Рахмет! Жауабыңыз сақталды.');
                fetchResponses();
            } catch (err) {
                console.error(err);
                alert('Қателік орын алды, қайтадан байқап көріңіз.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Жауапты жіберу';
            }
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        fetchResponses();
    </script>
</body>
</html>
